name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_cache:
        description: Quality job pnpm cache (runner image remains identical)
        required: true
        default: warm
        type: choice
        options: [warm, cold]
      host_run_id:
        description: Successful Nexus Terminal E2E run ID (empty selects latest successful main)
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  quality:
    name: Build and validate packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runner-image: ${{ steps.runner.outputs.image }}
      runner-fingerprint: ${{ steps.runner.outputs.fingerprint }}
      host-sha: ${{ steps.host.outputs.sha }}
      host-run-id: ${{ steps.host.outputs.run-id }}
      host-artifact-id: ${{ steps.build.outputs.result }}
      plugin-artifact-id: ${{ steps.candidates.outputs.artifact-id }}
    defaults:
      run:
        working-directory: plugins
    env:
      NEXUS_TEST_METRICS: ${{ github.workspace }}/test-artifacts/metrics
      NEXUS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts
      NEXUS_TEST_HOST_ROOT: ${{ github.workspace }}/host
      NEXUS_TEST_PLUGIN_SET: ${{ github.workspace }}/test-artifacts/candidates/staging-1
      NEXUS_E2E_DATA_ROOT: ${{ github.workspace }}/test-artifacts/browser-backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: plugins
      - name: Pin one successful Host revision
        id: host
        uses: actions/github-script@v9.0.0
        env:
          HOST_RUN_ID: ${{ inputs.host_run_id }}
        with:
          github-token: ${{ secrets.NEXUS_HOST_READ_TOKEN || github.token }}
          script: |
            const owner = '0honus0';
            const repo = 'nexus-terminal';
            let run;
            if (process.env.HOST_RUN_ID) {
              const runId = Number(process.env.HOST_RUN_ID);
              if (!Number.isSafeInteger(runId) || runId < 1) throw new Error('Invalid Host run ID');
              ({ data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId }));
            } else {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'e2e.yml', branch: 'main', status: 'success', per_page: 1,
              });
              [run] = data.workflow_runs;
            }
            if (!run || run.status !== 'completed' || run.conclusion !== 'success' || run.path !== '.github/workflows/e2e.yml') {
              throw new Error('A successful complete Host E2E run is required');
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('run-id', String(run.id));
            core.info(`Pinned Host ${owner}/${repo}@${run.head_sha} from E2E run ${run.id}`);

      - name: Checkout pinned Host test sources
        uses: actions/checkout@v7.0.1
        with:
          repository: 0honus0/nexus-terminal
          ref: ${{ steps.host.outputs.sha }}
          path: host
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: plugins/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: plugins/.node-version
          package-manager-cache: false
          cache: ${{ inputs.dependency_cache != 'cold' && 'pnpm' || '' }}
          cache-dependency-path: plugins/pnpm-lock.yaml
      - name: Install, build and check independent plugin behavior
        run: |
          echo "::group::Install and build plugins"
          bash scripts/measure-command.sh "$NEXUS_TEST_METRICS/install.json" pnpm install --frozen-lockfile
          bash scripts/measure-command.sh "$NEXUS_TEST_METRICS/build.json" pnpm run build
          echo "::endgroup::"
          echo "::group::Source checks and independent tests"
          bash scripts/measure-command.sh "$NEXUS_TEST_METRICS/check.json" pnpm run check
          bash scripts/measure-command.sh "$NEXUS_TEST_METRICS/fast.json" pnpm test:fast
          mkdir -p "$NEXUS_TEST_ARTIFACT_DIR"
          bash scripts/measure-command.sh "$NEXUS_TEST_METRICS/packages.json" \
            node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout \
            --test-reporter-destination="$NEXUS_TEST_ARTIFACT_DIR/packages.xml" \
            'plugins/*/tests/**/*.native.test.mjs' 'tests/{repository,templates}/**/*.native.test.mjs'
          echo "::endgroup::"

      - name: Resolve the immutable successful Host build
        id: build
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.NEXUS_HOST_READ_TOKEN || github.token }}
          result-encoding: string
          script: |
            const { resolveBuildArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/host/scripts/e2e/resolve-build-artifact.mjs`);
            return await resolveBuildArtifact({
              github, owner: '0honus0', repo: 'nexus-terminal',
              runId: Number('${{ steps.host.outputs.run-id }}'), sha: '${{ steps.host.outputs.sha }}', kind: 'application',
            });
      - name: Download pinned Host build
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ secrets.NEXUS_HOST_READ_TOKEN || github.token }}
          repository: 0honus0/nexus-terminal
          run-id: ${{ steps.host.outputs.run-id }}
          artifact-ids: ${{ steps.build.outputs.result }}
          path: host/packages
          merge-multiple: true
      - name: Prepare Host, sign candidates and check browser sources
        env:
          HOST_SHA: ${{ steps.host.outputs.sha }}
        run: |
          echo "::group::Install and verify the pinned Host"
          (
            cd ../host
            cmp .node-version ../plugins/.node-version
            bash ../plugins/scripts/measure-command.sh "$NEXUS_TEST_METRICS/host-install.json" pnpm install --frozen-lockfile
            node scripts/e2e/host-test-artifact.mjs verify "$HOST_SHA"
          )
          echo "::endgroup::"
          echo "::group::Sign candidates and check browser discovery"
          bash scripts/measure-command.sh "$NEXUS_TEST_METRICS/sign.json" pnpm prepare:interop "$NEXUS_TEST_ARTIFACT_DIR/candidates"
          bash scripts/measure-command.sh "$NEXUS_TEST_METRICS/browser-check.json" pnpm check:browser
          tar --exclude=node_modules --exclude=.git -czf "$NEXUS_TEST_ARTIFACT_DIR/plugin-test-source.tar.gz" .
          echo "::endgroup::"
      - name: Upload one immutable plugin build and candidate set
        id: candidates
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-candidates-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-artifacts/plugin-test-source.tar.gz
            test-artifacts/candidates/staging-1/
          if-no-files-found: error
          retention-days: 14
      - name: Resolve successful Host test environment
        id: environment
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.NEXUS_HOST_READ_TOKEN || github.token }}
          result-encoding: string
          script: |
            const { resolveBuildArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/host/scripts/e2e/resolve-build-artifact.mjs`);
            return await resolveBuildArtifact({
              github, owner: '0honus0', repo: 'nexus-terminal',
              runId: Number('${{ steps.host.outputs.run-id }}'), sha: '${{ steps.host.outputs.sha }}', kind: 'environment',
            });
      - name: Download the successful Host test environment
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ secrets.NEXUS_HOST_READ_TOKEN || github.token }}
          repository: 0honus0/nexus-terminal
          run-id: ${{ steps.host.outputs.run-id }}
          artifact-ids: ${{ steps.environment.outputs.result }}
          path: test-artifacts/environment
          merge-multiple: true
      - name: Use latest runner with the successful Host dependency identity
        id: runner
        env:
          HOST_SHA: ${{ steps.host.outputs.sha }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const environment = JSON.parse(fs.readFileSync('../test-artifacts/environment/environment.json', 'utf8'));
          if (environment.sha !== process.env.HOST_SHA ||
              environment.image !== 'ghcr.io/0honus0/nexus-terminal-e2e-runner:latest' ||
              !/^sha256:[a-f0-9]{64}$/.test(environment.observedDigest) ||
              !/^[a-f0-9]{64}$/.test(environment.fingerprint)) throw new Error('Invalid successful Host test environment');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `image=${environment.image}\nfingerprint=${environment.fingerprint}\n`);
          JS

      - name: Upload test reports and combinations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-artifacts/metrics/*
            test-artifacts/*.xml
            test-artifacts/*combination*.json
            test-artifacts/reports/*
            test-artifacts/browser/report.json
            test-artifacts/**/timings.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed Host evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-host-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-artifacts/
            !test-artifacts/candidates/development-publisher.pem
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Plugin tests shard ${{ matrix.shard }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    container:
      image: ${{ needs.quality.outputs.runner-image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init --ipc=host --cap-add=SYS_PTRACE
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        working-directory: plugins
    env:
      NEXUS_TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/layers
      NEXUS_TEST_LOG_DIR: ${{ github.workspace }}/test-artifacts/layers/logs
      NEXUS_TEST_HOST_ROOT: ${{ github.workspace }}/host
      NEXUS_TEST_PLUGIN_SET: ${{ github.workspace }}/test-artifacts/shared/candidates/staging-1
      NEXUS_E2E_DATA_ROOT: ${{ github.workspace }}/test-artifacts/browser-backend
      EXPECTED_RUNNER_FINGERPRINT: ${{ needs.quality.outputs.runner-fingerprint }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: plugins
      - name: Checkout the same pinned Host revision
        uses: actions/checkout@v7.0.1
        with:
          repository: 0honus0/nexus-terminal
          ref: ${{ needs.quality.outputs.host-sha }}
          path: host
      - name: Download the pinned successful Host build
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ secrets.NEXUS_HOST_READ_TOKEN || github.token }}
          repository: 0honus0/nexus-terminal
          run-id: ${{ needs.quality.outputs.host-run-id }}
          artifact-ids: ${{ needs.quality.outputs.host-artifact-id }}
          path: host/packages
          merge-multiple: true
      - name: Download this run's exact plugin build and candidates
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          artifact-ids: ${{ needs.quality.outputs.plugin-artifact-id }}
          path: test-artifacts/shared
          merge-multiple: true
      - name: Link cached dependencies, restore and verify exact builds
        env:
          HOST_SHA: ${{ needs.quality.outputs.host-sha }}
        run: |
          git config --global --add safe.directory "$(pwd -P)"
          git config --global --add safe.directory "$(realpath ../host)"
          test "$E2E_RUNNER_FINGERPRINT" = "$EXPECTED_RUNNER_FINGERPRINT"
          (cd ../host && pnpm install --frozen-lockfile --offline)
          tar -xzf ../test-artifacts/shared/plugin-test-source.tar.gz
          pnpm install --frozen-lockfile --prefer-offline
          node ../host/scripts/e2e/host-test-artifact.mjs verify "$HOST_SHA"
      - name: Run real Host interoperability shard
        id: interoperability
        run: |
          mkdir -p "$NEXUS_TEST_ARTIFACT_DIR/reports"
          bash scripts/measure-command.sh "$NEXUS_TEST_ARTIFACT_DIR/metrics/interop.json" \
            node --test --test-concurrency=1 --test-shard="${{ matrix.shard }}/8" \
            --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout \
            --test-reporter-destination="$NEXUS_TEST_ARTIFACT_DIR/reports/interoperability.xml" \
            'tests/interoperability/**/*.native.test.mjs'
      - name: Run plugin browser shard against the same candidates
        if: ${{ !cancelled() && steps.interoperability.outcome != 'skipped' }}
        run: bash scripts/measure-command.sh "$NEXUS_TEST_ARTIFACT_DIR/metrics/browser.json" pnpm test:browser --shard "${{ matrix.shard }}/8"
      - name: Record shard resource environment
        if: always()
        env:
          RUNNER_IMAGE: ${{ needs.quality.outputs.runner-image }}
          HOST_SHA: ${{ needs.quality.outputs.host-sha }}
          DEPENDENCY_CACHE: ${{ inputs.dependency_cache || 'warm' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8').trim() : null;
          const root = process.env.NEXUS_TEST_ARTIFACT_DIR + '/metrics';
          fs.mkdirSync(root, { recursive: true });
          fs.writeFileSync(root + '/environment.json', JSON.stringify({
            sha: process.env.GITHUB_SHA, hostSha: process.env.HOST_SHA,
            runnerImage: process.env.RUNNER_IMAGE, fingerprint: process.env.E2E_RUNNER_FINGERPRINT, refreshWeek: process.env.E2E_RUNNER_REFRESH_WEEK,
            dependencyCache: process.env.DEPENDENCY_CACHE, node: process.version,
            cpus: os.availableParallelism(), memoryBytes: os.totalmem(),
            cgroupMemoryPeakBytes: read('/sys/fs/cgroup/memory.peak') ?? read('/sys/fs/cgroup/memory/memory.max_usage_in_bytes'),
            cgroupMemoryLimitBytes: read('/sys/fs/cgroup/memory.max'), cgroupCpuMax: read('/sys/fs/cgroup/cpu.max'),
          }, null, 2));
          JS
      - name: Upload shard reports and combinations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-tests-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-artifacts/layers/metrics/*
            test-artifacts/layers/logs/*.log
            test-artifacts/layers/reports/*
            test-artifacts/layers/*combination*.json
            test-artifacts/layers/browser/report.json
            test-artifacts/layers/**/webserver/**/*.log
            test-artifacts/**/timings.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed Host evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-host-failure-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-artifacts/layers/
            test-artifacts/browser-backend/
          if-no-files-found: ignore
          retention-days: 7
