name: Validate
on:
  push:
  pull_request:
jobs:
  validate:
    name: Plugin validation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/check.mjs
