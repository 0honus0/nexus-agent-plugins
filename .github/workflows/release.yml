name: Release plugins
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to upload into
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/check.mjs
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Write signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NEXUS_AGENT_PLUGIN_SIGNING_KEY_PEM }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/plugin-signing-key.pem"
      - name: Build signed first-party catalog
        shell: bash
        run: >-
          node scripts/build-catalog-release.mjs
          "$RUNNER_TEMP/plugin-signing-key.pem"
          .dist
          "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" .dist/* --clobber
