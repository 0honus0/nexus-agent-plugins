name: Release package
on:
  workflow_dispatch:
    inputs:
      package_id:
        description: Package directory under plugins (one independent release)
        required: true
        type: choice
        options:
          - nexus.agent
          - nexus.tools.remote
          - nexus.tools.browser
          - nexus.tools.integrations
          - nexus.tools.agent
          - nexus.ui.chat
          - nexus.services.mcp
          - nexus.services.acp
      release_tag:
        description: Existing draft release tag receiving the immutable package and descriptor
        required: true
concurrency:
  group: plugin-package-${{ inputs.package_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Require complete source validation
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'validate.yml', head_sha: context.sha,
              status: 'success', per_page: 1,
            });
            const [run] = data.workflow_runs;
            if (!run || run.head_sha !== context.sha || run.path !== '.github/workflows/validate.yml' ||
                run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('Complete successful Validate workflow required for this exact source');
            }
            core.info(`Validated source ${context.sha}: ${run.html_url}`);
      - name: Build and validate selected package
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          if [[ -f "plugins/$PACKAGE_ID/package.json" ]]; then
            pnpm --dir "plugins/$PACKAGE_ID" run build
          elif [[ -f "plugins/$PACKAGE_ID/build.mjs" ]]; then
            node "plugins/$PACKAGE_ID/build.mjs"
          fi
          pnpm run lint
          pnpm run format:check
          node scripts/check.mjs "plugins/$PACKAGE_ID"
          pnpm run check:composition
          pnpm --dir "plugins/$PACKAGE_ID" test
      - name: Write signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NEXUS_AGENT_PLUGIN_SIGNING_KEY_PEM }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/plugin-signing-key.pem"
      - run: node scripts/check-signing-key.mjs "$RUNNER_TEMP/plugin-signing-key.pem"
      - name: Build selected package
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_base_url="$(node -e 'process.stdout.write("https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/" + encodeURIComponent(process.env.RELEASE_TAG))')"
          node scripts/build-release.mjs "plugins/$PACKAGE_ID" "$RUNNER_TEMP/plugin-signing-key.pem" .dist "$release_base_url"
      - name: Upload immutable package assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/publish-package-release.mjs .dist "$GITHUB_REPOSITORY" "$RELEASE_TAG"
