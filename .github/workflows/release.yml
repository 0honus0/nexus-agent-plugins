name: Release plugins
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft or published GitHub release tag to upload into
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name || github.event.inputs.release_tag }}"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "checkout_ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}
      - name: Require validated current main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          git fetch origin main --no-tags
          main_sha="$(git rev-parse origin/main)"
          if [[ "$source_sha" != "$main_sha" ]]; then
            echo "Plugin release must use the current main commit: source=$source_sha main=$main_sha" >&2
            exit 1
          fi

          checks="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/commits/$source_sha/check-runs?check_name=Plugin%20validation%20gate&status=completed")"
          successful="$(jq '[.check_runs[] | select(.name == "Plugin validation gate" and .conclusion == "success" and .app.slug == "github-actions")] | length' <<< "$checks")"
          if [[ "$successful" -lt 1 ]]; then
            echo "Current plugin main commit has no successful Plugin validation gate check: $source_sha" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node scripts/check.mjs
      - name: Write signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.NEXUS_AGENT_PLUGIN_SIGNING_KEY_PEM }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/plugin-signing-key.pem"
      - name: Build signed first-party catalog
        shell: bash
        run: >-
          node scripts/build-catalog-release.mjs
          "$RUNNER_TEMP/plugin-signing-key.pem"
          .dist
          "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" .dist/* --clobber
