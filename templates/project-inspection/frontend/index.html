<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Project inspection</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			<h1>Project inspection</h1>
			<p>Inspect a project using the shared remote tools and produce a report.</p>
			<form id="inspection-form">
				<label
					>Authorized connection ID <input id="connection" type="number" min="1" step="1" required
				/></label>
				<label
					>Project directory <input id="directory" placeholder="/srv/project" required maxlength="4096"
				/></label>
				<button id="inspect" type="submit" disabled>Generate report</button>
			</form>
			<p id="status" role="status">Connecting…</p>
			<button id="refresh" type="button" disabled>Refresh report and approvals</button>
			<section id="approvals" aria-label="Pending approvals"></section>
			<section aria-labelledby="report-title">
				<h2 id="report-title">Inspection report</h2>
				<pre id="report">No report yet.</pre>
			</section>
		</main>
		<script type="module" src="app.mjs"></script>
	</body>
</html>
